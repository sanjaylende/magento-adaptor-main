# Addresses allowed to open the staff console (/admin). Copy to /etc/nginx/flipick/admin-allow.conf.
# NEEDS YOU: put your office / VPN addresses here. Until you do, nobody can open /admin (deny all).
# Visitor addresses here are the real ones (nginx takes them from Cloudflare's CF-Connecting-IP header).
# allow 203.0.113.10;     # example: office
# allow 198.51.100.0/24;  # example: VPN
deny all;
