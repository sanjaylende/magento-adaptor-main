# nginx site for the Magento adapter behind Cloudflare. Replace the server name and certificate paths.
# Install:  copy cloudflare-ips.conf, admin-allow.conf and icici-allow.conf into /etc/nginx/flipick/,
#           copy this file to /etc/nginx/conf.d/, then:  nginx -t && systemctl reload nginx
#
# What it enforces
#   * Only requests that came through Cloudflare are served on 443 (anything else gets 444: connection closed, no answer).
#   * The real visitor address is taken from CF-Connecting-IP (only trusted from Cloudflare's own ranges).
#   * Request size, header size, time limits, and per-address request limits (M4).
#   * /admin is reachable only from addresses in admin-allow.conf (and should also sit behind Cloudflare Access, see the guide).
#   * The ICICI callback can be limited to ICICI's addresses (icici-allow.conf).
#   * TLS 1.2 and 1.3 only. HSTS and the other security headers are set by the application (helmet), not here.
#   * Framing is NOT blocked here: the adapter pages are shown inside each merchant's Magento admin and set their own
#     frame-ancestors rule.

include /etc/nginx/flipick/cloudflare-ips.conf;

limit_req_zone  $binary_remote_addr zone=flipick_general:10m rate=20r/s;
limit_req_zone  $binary_remote_addr zone=flipick_login:10m   rate=10r/m;
limit_req_zone  $binary_remote_addr zone=flipick_callback:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=flipick_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name magento.flipickvideogenerator.com;
    if ($from_cloudflare = 0) { return 444; }
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name magento.flipickvideogenerator.com;

    ssl_certificate     /etc/ssl/flipick/fullchain.pem;
    ssl_certificate_key /etc/ssl/flipick/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:flipick_tls:10m;
    ssl_session_tickets off;

    server_tokens off;

    # Anything that did not come through Cloudflare is dropped without an answer.
    if ($from_cloudflare = 0) { return 444; }

    # ---- request limits (M4) ----
    client_max_body_size        1m;       # the application also limits JSON bodies to 1 MB
    client_body_buffer_size     128k;
    client_header_buffer_size   4k;
    large_client_header_buffers 4 8k;
    client_body_timeout         15s;
    client_header_timeout       15s;
    send_timeout                30s;
    keepalive_timeout           30s;
    limit_conn flipick_conn 40;
    limit_req  zone=flipick_general burst=60 nodelay;
    limit_req_status 429;

    # ---- staff console: allow-listed addresses only, plus a strict limit on login attempts ----
    location /admin {
        include /etc/nginx/flipick/admin-allow.conf;
        limit_req zone=flipick_login burst=5 nodelay;
        include /etc/nginx/flipick/proxy.conf;
    }

    # ---- bank callback: only ICICI's addresses once ICICI has given them ----
    location = /api/payments/callback/icici {
        include /etc/nginx/flipick/icici-allow.conf;
        limit_req zone=flipick_callback burst=20 nodelay;
        include /etc/nginx/flipick/proxy.conf;
    }

    location / {
        include /etc/nginx/flipick/proxy.conf;
    }
}
