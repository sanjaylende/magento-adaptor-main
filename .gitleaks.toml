# Secret-scan rules: gitleaks defaults plus a short allow-list for values that are public by design.
[extend]
useDefault = true

[allowlist]
description = "Local development defaults that are documented and not secret"
regexes = [
  '''adapter_(owner|app)_local''',
]
paths = [
  '''package-lock\.json''',
  '''test/logs\.e2e\.test\.js''',   # deliberately fake secrets that the test feeds to the logger to prove they are masked
]
