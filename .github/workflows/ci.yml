name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: node --check server.js
      - run: find src public -name "*.js" -print0 | xargs -0 -n1 node --check
      # The tests create a scratch database on this server (TEST_DATABASE_SUPERUSER_URL, default postgres/postgres on 5432) with the adapter's schema and test-only roles.
      - run: npm test
