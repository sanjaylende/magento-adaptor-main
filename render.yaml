# Render Blueprint: one Web Service (Node 22, Express 5) + one managed PostgreSQL.
# Create from Render dashboard -> Blueprints -> New Blueprint -> point at this repo.
# Secrets (marked sync: false below) must be filled in by hand in the Render dashboard; they are NOT in this file.
# See DEPLOY-RENDER.md for the full runbook (DB bootstrap, migrations, ICICI callback allow-list, custom domain).

databases:
  - name: magento-adapter-db
    plan: basic-256mb            # smallest paid plan; free Postgres expires after 30 days
    databaseName: ltx_1jnl
    user: magento_adapter_owner
    postgresMajorVersion: "16"
    ipAllowList: []              # [] = only reachable from Render services; add office IPs if you need external psql

services:
  - type: web
    name: magento-adapter
    runtime: node
    plan: starter                # free spins down after 15 min idle -> scheduler + webhooks break; use starter at minimum
    region: oregon               # match the database region
    branch: main
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true

    envVars:
      # --- Service ---
      - key: NODE_VERSION
        value: "22.9.0"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"           # Render routes external 443 -> container PORT; 10000 is Render's default
      - key: PUBLIC_BASE_URL
        sync: false              # set to https://<your-service>.onrender.com, or your custom domain
      - key: LOG_LEVEL
        value: info
      - key: LOG_FORMAT
        value: json              # Render log viewer parses JSON nicely
      - key: LOG_TO_FILE
        value: "false"           # Render disks are ephemeral; write to stdout, let Render ship logs
      - key: SECURITY_CONTACT
        value: mailto:security@flipick.com

      # --- Database (Render Postgres, TLS required) ---
      - key: DATABASE_URL
        fromDatabase:
          name: magento-adapter-db
          property: connectionString
      - key: DATABASE_ADMIN_URL  # see DEPLOY-RENDER.md step 3: Render gives one role; either point both to it (simpler,
        sync: false              # loses RLS enforcement for the app role) or create a second LOGIN role via psql.
      - key: DB_SCHEMA
        value: magento_adapter
      - key: DB_POOL_MAX
        value: "8"
      - key: DB_IDLE_TIMEOUT_MS
        value: "30000"
      - key: DB_SSL
        value: require           # Render requires TLS; cert is from a public CA so no DB_SSL_CA needed
      - key: RUN_MIGRATIONS_ON_START
        value: "true"            # the app applies pending migrations on boot under an advisory lock

      # --- Secrets (fill in Render dashboard; never commit) ---
      - key: ADAPTER_SECRET_KEY  # 64 hex chars: `node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"`
        generateValue: true      # Render generates once on first deploy; keep it stable or you invalidate stored secrets
      - key: ADMIN_AUTH_BASE_URL # staff sign in with their LTX account; defaults to FLIPICK_VIDEO_ENGINE_BASE_URL when empty
        sync: false
      - key: INTERNAL_API_SECRET # shared with LTX (X-Internal-Secret) for /internal/magento-token/:shop
        sync: false

      # --- Magento catalog ---
      - key: MAGENTO_CATEGORY_ATTRIBUTE_CODE
        value: product_type      # the product attribute the adapter reads as a product's category

      # --- Payments: ICICI PRODUCTION (safety.js refuses UAT at NODE_ENV=production) ---
      - key: ICICI_PG_BASE_URL
        value: https://pgpay.icicibank.com
      - key: ICICI_PG_MERCHANT_ID
        sync: false
      - key: ICICI_PG_AGGREGATOR_ID
        sync: false
      - key: ICICI_PG_SECRET_KEY
        sync: false
      - key: ICICI_CALLBACK_ALLOWED_IPS
        sync: false              # ask ICICI for their webhook source ranges; comma-separated, CIDR allowed

      # --- Billing ---
      - key: BILLING_ORDER_CHECK_MIN_INTERVAL_MS
        value: "10000"           # the bank is asked about one order at most this often while the merchant's page polls it
      - key: BILLING_GRACE_DAYS
        value: "3"
      - key: BILLING_REMINDER_DAYS
        value: "5"
      - key: GST_RATE_BP
        value: "1800"
      - key: INR_PER_USD
        value: "83"
      - key: SELLER_NAME
        value: Flipick
      - key: SELLER_ADDRESS
        sync: false
      - key: SELLER_GST_NUMBER
        sync: false

      # --- Flipick video engine ---
      - key: FLIPICK_SPONSORED_ADS_BASE_URL
        sync: false
      - key: FLIPICK_VVP_API_KEY
        sync: false
      - key: FLIPICK_TENANT_ID
        sync: false
      - key: FLIPICK_VIDEO_ENGINE_BASE_URL
        sync: false
      - key: FLIPICK_VIDEO_ENGINE_API_KEY
        sync: false
      - key: VIDEO_ENGINE_WEBHOOK_SECRET
        sync: false
      - key: RETAILER_NAME
        sync: false
