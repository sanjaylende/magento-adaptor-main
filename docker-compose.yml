# LEGACY / ROLLBACK ONLY. The adapter's data now lives in its own schema (magento_adapter) of the shared PostgreSQL database ltx_1jnl on
# 127.0.0.1:5432 (see README, "Database"). This container is no longer needed day to day; start it only to roll back
# (docker compose up -d db, then point DATABASE_URL / DATABASE_ADMIN_URL at 5434 and set DB_SCHEMA=public).
name: magento-adaptor
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: adapter_owner
      POSTGRES_PASSWORD: adapter_owner_local
      POSTGRES_DB: magento_adapter
    ports: ["127.0.0.1:5434:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
volumes:
  pgdata: {}
